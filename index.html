<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GitLib | Universal Library</title>
  
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="logo">
        <img src="icons/logo.svg" alt="GitLib Logo" width="28" height="28">
        <span>Git<b>Lib</b></span>
      </div>
      <!-- Top nav removed to fix aesthetics -->
    </div>
  </header>

  <main class="main-content">
    <section id="search-view" class="view active">
      <div class="search-hero">
        <h1>GitLib by Rayees</h1>
        <p>Search Gutenberg, Open Library, and Google Books instantly. <b>Libgen</b> searches in the background for maximum accuracy.</p>
        
        <div class="search-box-wrapper">
          <div class="search-input-group">
            <i class="fa-solid fa-search search-icon"></i>
            <input type="text" id="search-input" placeholder="Search by title, author, or ISBN..." autocomplete="off">
            <button id="clear-search" class="clear-btn hidden"><i class="fa-solid fa-xmark"></i></button>
            <button id="search-submit" class="search-btn">Search</button>
          </div>
          <div id="autocomplete-dropdown" class="autocomplete-box hidden"></div>
        </div>

        <div class="source-selector">
          <div class="radio-pills">
            <label class="pill"><input type="radio" name="api-source" value="auto" checked><span><i class="fa-solid fa-bolt"></i> Auto (All)</span></label>
            <label class="pill"><input type="radio" name="api-source" value="libgen"><span><i class="fa-solid fa-server"></i> Libgen</span></label>
            <label class="pill"><input type="radio" name="api-source" value="gutendex"><span><i class="fa-solid fa-book-open"></i> Gutenberg</span></label>
            <label class="pill"><input type="radio" name="api-source" value="openlibrary"><span><i class="fa-solid fa-landmark"></i> Open Lib</span></label>
            <label class="pill"><input type="radio" name="api-source" value="google"><span><i class="fa-brands fa-google"></i> Google</span></label>
          </div>
        </div>
      </div>

      <div class="results-header hidden" id="results-header">
        <h2 id="results-title">Search Results</h2>
        <span id="results-count" class="count-badge">0 found</span>
      </div>

      <div id="loader" class="loader-container hidden">
        <div class="spinner"></div>
        <p id="loader-text">Fetching books...</p>
        <div class="progress-bar-wrapper"><div id="progress-bar" class="progress-bar"></div></div>
      </div>

      <div id="book-grid" class="book-grid"></div>
    </section>

    <section id="history-view" class="view">
      <div class="history-hero">
        <div class="history-title-wrap">
          <h2><i class="fa-solid fa-bookmark"></i> My Local Library</h2>
          <button id="clear-all-history" class="btn-secondary"><i class="fa-solid fa-trash-can"></i> Clear</button>
        </div>
        <p>Books you have downloaded or saved for later.</p>
      </div>
      <div id="history-grid" class="book-grid"></div>
      <div id="history-empty" class="empty-state hidden">
        <i class="fa-solid fa-ghost"></i>
        <p>Your library is empty.</p>
      </div>
    </section>
  </main>

  <!-- Glassmorphism Bottom Dock -->
  <nav class="bottom-dock">
    <button id="tab-search-btn" class="dock-btn active"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
    <button id="tab-history-btn" class="dock-btn"><i class="fa-solid fa-bookmark"></i> Library (<span id="history-count">0</span>)</button>
  </nav>

  <script src="js/animations.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script>
</body>
</html>
